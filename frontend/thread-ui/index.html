<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Qodex Thread UI</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="window">
      <header class="titlebar">
        <div class="titlebar__drag-region" id="titlebar-drag-region">
          <span class="titlebar__title">Qodex Thread UI</span>
        </div>
        <div class="titlebar__controls">
          <button
            class="titlebar__button"
            id="window-minimize"
            type="button"
            aria-label="Minimize window"
          >
            Min
          </button>
          <button
            class="titlebar__button"
            id="window-maximize"
            type="button"
            aria-label="Maximize window"
          >
            Max
          </button>
          <button
            class="titlebar__button titlebar__button--close"
            id="window-close"
            type="button"
            aria-label="Close window"
          >
            Close
          </button>
        </div>
      </header>
      <main class="thread-ui">
        <section class="thread-view">
          <div class="thread-view__items" id="thread-items">
            <p class="thread-view__empty" id="thread-empty-state">Resume a thread to load its history.</p>
          </div>
        </section>
        <form class="composer" id="composer-form">
          <textarea
            class="composer__input"
            id="composer-input"
            rows="1"
            placeholder="Send a message"
            aria-label="Send a message"
          ></textarea>
        </form>
      </main>
    </div>
    <script src="./init.js"></script>
  </body>
</html>
