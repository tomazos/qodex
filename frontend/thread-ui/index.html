<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Qodex Thread UI</title>
    <link rel="stylesheet" href="./node_modules/katex/dist/katex.min.css" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="window">
      <main class="thread-ui">
        <section class="thread-view">
          <div class="thread-view__items" id="thread-items">
            <p class="thread-view__empty" id="thread-empty-state">Resume a thread to load its history.</p>
          </div>
        </section>
        <form class="composer" id="composer-form">
          <textarea
            class="composer__input"
            id="composer-input"
            rows="1"
            placeholder="Send a message"
            aria-label="Send a message"
          ></textarea>
        </form>
        <div class="thread-status-bar" aria-live="polite">
          <div class="thread-status" id="thread-status">Idle</div>
          <div class="thread-settings" id="thread-settings"></div>
        </div>
      </main>
    </div>
    <script src="./init.js"></script>
  </body>
</html>
