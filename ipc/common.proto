syntax = "proto3";

package qodex.threadui.ipc.common;

enum ResultStatus {
  RESULT_STATUS_UNSPECIFIED = 0;
  RESULT_STATUS_OK = 1;
  RESULT_STATUS_ERROR = 2;
}

enum ThreadStatusKind {
  THREAD_STATUS_KIND_UNSPECIFIED = 0;
  THREAD_STATUS_KIND_NOT_LOADED = 1;
  THREAD_STATUS_KIND_IDLE = 2;
  THREAD_STATUS_KIND_SYSTEM_ERROR = 3;
  THREAD_STATUS_KIND_ACTIVE = 4;
}

enum ThreadStatusActiveFlag {
  THREAD_STATUS_ACTIVE_FLAG_UNSPECIFIED = 0;
  THREAD_STATUS_ACTIVE_FLAG_WAITING_ON_APPROVAL = 1;
  THREAD_STATUS_ACTIVE_FLAG_WAITING_ON_USER_INPUT = 2;
}

enum LinkKind {
  LINK_KIND_UNSPECIFIED = 0;
  LINK_KIND_UNKNOWN = 1;
  LINK_KIND_WEB = 2;
  LINK_KIND_FILE = 3;
  LINK_KIND_MAILTO = 4;
}

enum LinkActionKind {
  LINK_ACTION_KIND_UNSPECIFIED = 0;
  LINK_ACTION_KIND_NONE = 1;
  LINK_ACTION_KIND_OPEN = 2;
  LINK_ACTION_KIND_OPEN_EXTERNALLY = 3;
  LINK_ACTION_KIND_REVEAL_IN_FOLDER = 4;
}

message ResolvedLink {
  string raw_href = 1;
  string normalized_href = 2;
  string tooltip = 3;
  LinkKind kind = 4;
  string resolved_path = 5;
  bool exists = 6;
  bool is_directory = 7;
  bool has_line = 8;
  int64 line = 9;
  bool has_column = 10;
  int64 column = 11;
  LinkActionKind default_action = 12;
  bool can_open = 13;
  bool can_open_externally = 14;
  bool can_reveal_in_folder = 15;
  bool can_copy_resolved_path = 16;
}

message UserMessage {
  string text = 1;
}

message AgentMessage {
  string text = 1;
}

message Plan {
  string text = 1;
}

message Reasoning {
  string text = 1;
}

enum CommandExecutionActionKind {
  COMMAND_EXECUTION_ACTION_KIND_UNSPECIFIED = 0;
  COMMAND_EXECUTION_ACTION_KIND_READ = 1;
  COMMAND_EXECUTION_ACTION_KIND_LIST_FILES = 2;
  COMMAND_EXECUTION_ACTION_KIND_SEARCH = 3;
  COMMAND_EXECUTION_ACTION_KIND_UNKNOWN = 4;
}

message CommandExecutionAction {
  CommandExecutionActionKind kind = 1;
  string path = 2;
  string query = 3;
  string name = 4;
  string command = 5;
}

message CommandExecution {
  string command = 1;
  string cwd = 2;
  string status = 3;
  bool has_exit_code = 4;
  int64 exit_code = 5;
  bool has_duration_ms = 6;
  int64 duration_ms = 7;
  string process_id = 8;
  string aggregated_output = 9;
  repeated CommandExecutionAction actions = 10;
}

enum FileChangeKind {
  FILE_CHANGE_KIND_UNSPECIFIED = 0;
  FILE_CHANGE_KIND_ADD = 1;
  FILE_CHANGE_KIND_DELETE = 2;
  FILE_CHANGE_KIND_UPDATE = 3;
}

message FileChangeChange {
  string path = 1;
  FileChangeKind kind = 2;
  string move_path = 3;
  string diff = 4;
}

message FileChange {
  string status = 1;
  repeated FileChangeChange changes = 2;
}

message McpToolCall {
  string text = 1;
}

message DynamicToolCall {
  string text = 1;
}

message CollabAgentToolCall {
  string text = 1;
}

message WebSearch {
  string text = 1;
}

message ImageView {
  string text = 1;
}

message ImageGeneration {
  string result = 1;
  string revised_prompt = 2;
  string saved_path = 3;
  string status = 4;
}

message EnteredReviewMode {
  string text = 1;
}

message ExitedReviewMode {
  string text = 1;
}

message ContextCompaction {
  string text = 1;
}

message Item {
  string item_id = 16;

  oneof kind {
    UserMessage user_message = 1;
    AgentMessage agent_message = 2;
    Plan plan = 3;
    Reasoning reasoning = 4;
    CommandExecution command_execution = 5;
    FileChange file_change = 6;
    McpToolCall mcp_tool_call = 7;
    DynamicToolCall dynamic_tool_call = 8;
    CollabAgentToolCall collab_agent_tool_call = 9;
    WebSearch web_search = 10;
    ImageView image_view = 11;
    ImageGeneration image_generation = 12;
    EnteredReviewMode entered_review_mode = 13;
    ExitedReviewMode exited_review_mode = 14;
    ContextCompaction context_compaction = 15;
  }
}

message RpcEnvelope {
  uint64 request_id = 1;
  bool is_response = 2;
  string method = 4;
  bytes payload = 5;
}
