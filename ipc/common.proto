syntax = "proto3";

package qodex.threadui.ipc.common;

enum ResultStatus {
  RESULT_STATUS_UNSPECIFIED = 0;
  RESULT_STATUS_OK = 1;
  RESULT_STATUS_ERROR = 2;
}

message UserMessage {
  string text = 1;
}

message AgentMessage {
  string text = 1;
}

message Plan {
  string text = 1;
}

message Reasoning {
  string text = 1;
}

message CommandExecution {
  string command = 1;
  string cwd = 2;
  string status = 3;
  bool has_exit_code = 4;
  int64 exit_code = 5;
  bool has_duration_ms = 6;
  int64 duration_ms = 7;
  string process_id = 8;
  string aggregated_output = 9;
  repeated string action_labels = 10;
}

enum FileChangeKind {
  FILE_CHANGE_KIND_UNSPECIFIED = 0;
  FILE_CHANGE_KIND_ADD = 1;
  FILE_CHANGE_KIND_DELETE = 2;
  FILE_CHANGE_KIND_UPDATE = 3;
}

message FileChangeChange {
  string path = 1;
  FileChangeKind kind = 2;
  string move_path = 3;
  string diff = 4;
}

message FileChange {
  string status = 1;
  repeated FileChangeChange changes = 2;
}

message McpToolCall {
  string text = 1;
}

message DynamicToolCall {
  string text = 1;
}

message CollabAgentToolCall {
  string text = 1;
}

message WebSearch {
  string text = 1;
}

message ImageView {
  string text = 1;
}

message ImageGeneration {
  string text = 1;
}

message EnteredReviewMode {
  string text = 1;
}

message ExitedReviewMode {
  string text = 1;
}

message ContextCompaction {
  string text = 1;
}

message Item {
  oneof kind {
    UserMessage user_message = 1;
    AgentMessage agent_message = 2;
    Plan plan = 3;
    Reasoning reasoning = 4;
    CommandExecution command_execution = 5;
    FileChange file_change = 6;
    McpToolCall mcp_tool_call = 7;
    DynamicToolCall dynamic_tool_call = 8;
    CollabAgentToolCall collab_agent_tool_call = 9;
    WebSearch web_search = 10;
    ImageView image_view = 11;
    ImageGeneration image_generation = 12;
    EnteredReviewMode entered_review_mode = 13;
    ExitedReviewMode exited_review_mode = 14;
    ContextCompaction context_compaction = 15;
  }
}

message RpcEnvelope {
  uint64 request_id = 1;
  bool is_response = 2;
  string method = 4;
  bytes payload = 5;
}
