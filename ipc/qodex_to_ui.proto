syntax = "proto3";

package qodex.threadui.ipc.qodex_to_ui;

import "common.proto";

service QodexToUi {
  rpc AddItems(AddItemsRequest) returns (AddItemsResponse);
  rpc SetThreadStatus(SetThreadStatusRequest) returns (SetThreadStatusResponse);
}

message AddItemsRequest {
  repeated qodex.threadui.ipc.common.Item items = 1;
}

message AddItemsResponse {
  qodex.threadui.ipc.common.ResultStatus status = 1;
  string message = 2;
}

message SetThreadStatusRequest {
  qodex.threadui.ipc.common.ThreadStatusKind kind = 1;
  string text = 2;
  repeated qodex.threadui.ipc.common.ThreadStatusActiveFlag active_flags = 3;
  string active_turn_id = 4;
}

message SetThreadStatusResponse {
  qodex.threadui.ipc.common.ResultStatus status = 1;
  string message = 2;
}
